# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# CI runs `cargo deny check advisories bans licenses sources`.

[graph]
# codeMap ships for macOS and Linux only.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
# Fail on any RustSec vulnerability, and on yanked crates.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing codeMap under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
