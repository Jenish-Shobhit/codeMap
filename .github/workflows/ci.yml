name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so new RustSec advisories surface without a push.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit, snapshot, git-store, hook, manifest and pseudo-terminal tests.
      # The performance, smoke and live herdr tests are #[ignore]: they need
      # a release build, a large generated repo, or a throwaway herdr server.
      - run: cargo test --locked
      - name: Release build answers --version
        run: |
          cargo build --release --locked
          ./target/release/codemap --version

  screenshots:
    name: README screenshots are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --example screenshots
      - name: docs/assets matches the rendered frames
        run: |
          if ! git diff --exit-code --stat -- docs/assets; then
            echo "::error::Run 'cargo run --example screenshots' and commit docs/assets."
            exit 1
          fi

  msrv:
    name: MSRV (Rust 1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain goes in `with`, not the ref, so Dependabot does not
      # mistake it for an action version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      # `+1.90` overrides rust-toolchain.toml, which selects stable.
      - run: cargo +1.90 test --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
