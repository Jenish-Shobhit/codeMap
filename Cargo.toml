[package]
name = "codemap"
version = "0.1.0"
edition = "2021"
# Checked by the MSRV job in CI, which runs the tests: the dev-dependency
# tree-sitter 0.27 needs 1.90.
rust-version = "1.90"
description = "herdr plugin that reviews what your agents changed and shows the git history around it"
authors = ["Jenish Shobhit"]
license = "MIT"
repository = "https://github.com/Jenish-Shobhit/codeMap"
homepage = "https://github.com/Jenish-Shobhit/codeMap#readme"
readme = "README.md"
keywords = ["herdr", "tui", "git", "code-review", "agents"]
categories = ["command-line-utilities", "development-tools"]
# A herdr plugin, installed with `herdr plugin install`; the crates.io name
# `codemap` belongs to another project.
publish = false

[[bin]]
name = "codemap"
path = "src/main.rs"

[lib]
name = "codemap"
path = "src/lib.rs"

[dependencies]
# herdr's own UI stack (see herdr's Cargo.toml at v0.9.x).
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 4
debug = false
strip = true

[dev-dependencies]
# The README capture of the popup over a real herdr client
# (`cargo run --example screenshots -- --herdr`).
vt100 = "0.16"
# tests/no_comments.rs parses the code to find comments.
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
