[package]
name = "codemorph"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "See your code as a map, and what your agents changed on it. A herdr plugin."
license = "MIT"
readme = "README.md"
keywords = ["herdr", "tui", "code-map", "flowchart", "review"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codemorph"
path = "src/main.rs"

[lib]
name = "codemorph"
path = "src/lib.rs"

[dependencies]
# herdr's own UI stack (see herdr's Cargo.toml at v0.9.x).
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"

[profile.release]
opt-level = 3
codegen-units = 4
debug = false
strip = true
