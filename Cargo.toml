[package]
name = "codemap"
version = "0.1.0"
edition = "2021"
# Checked by the MSRV job in CI. tree-sitter-language 0.1.8 needs 1.90.
rust-version = "1.90"
description = "herdr plugin that shows your code as a map and flowcharts, and reviews what your agents changed"
authors = ["Jenish Shobhit"]
license = "MIT"
repository = "https://github.com/Jenish-Shobhit/codeMap"
homepage = "https://github.com/Jenish-Shobhit/codeMap#readme"
readme = "README.md"
keywords = ["herdr", "tui", "tree-sitter", "code-review", "visualization"]
categories = ["command-line-utilities", "development-tools", "visualization"]
# A herdr plugin, installed with `herdr plugin install`; the crates.io name
# `codemap` belongs to another project.
publish = false

[[bin]]
name = "codemap"
path = "src/main.rs"

[lib]
name = "codemap"
path = "src/lib.rs"

[dependencies]
# herdr's own UI stack (see herdr's Cargo.toml at v0.9.x).
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"

[profile.release]
opt-level = 3
codegen-units = 4
debug = false
strip = true
